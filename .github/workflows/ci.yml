name: Septimus OS CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-backend-core:
    name: Test Go Backend Core
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend-core/go.mod
          cache-dependency-path: backend-core/go.sum

      - name: Run Go build and vet
        working-directory: ./backend-core
        run: |
          go mod download
          go vet ./...
          go build ./...

      - name: Run Go tests
        working-directory: ./backend-core
        run: go test -v ./...

  test-ai-sidecar:
    name: Test Python AI Sidecar
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-sidecar/requirements.txt

      - name: Install dependencies
        working-directory: ./ai-sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        working-directory: ./ai-sidecar
        run: pytest tests/ -v
