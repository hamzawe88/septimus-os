name: Septimus OS CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-backend-core:
    name: Test Go Backend Core
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend-core/go.mod
          cache-dependency-path: backend-core/go.sum

      - name: Run Go build and vet
        working-directory: ./backend-core
        run: |
          go mod download
          go vet ./...
          go build ./...

      - name: Run Go tests
        working-directory: ./backend-core
        run: go test -v ./...

      - name: Scan reachable Go vulnerabilities
        working-directory: ./backend-core
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test-drive:
    name: Test Go Drive Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: septimus-drive/go.mod
          cache-dependency-path: septimus-drive/go.sum
      - working-directory: ./septimus-drive
        run: go test -v ./...

  test-ai-sidecar:
    name: Test Python AI Sidecar
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-sidecar/requirements.txt

      - name: Install dependencies
        working-directory: ./ai-sidecar
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt

      - name: Audit Python dependencies
        working-directory: ./ai-sidecar
        run: pip-audit -r requirements.txt

      - name: Run Pytest
        working-directory: ./ai-sidecar
        run: pytest tests/ -v

  test-frontend:
    name: Test Frontend Type Safety
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  test-yjs:
    name: Test Yjs Authentication
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./yjs-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yjs-server/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  test-e2e:
    name: Test CRM, Schema, Security, and Visual E2E
    runs-on: ubuntu-latest
    needs: [test-backend-core, test-drive, test-ai-sidecar, test-frontend, test-yjs]
    env:
      JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-characters
      SETTINGS_ENC_KEY: ci-settings-encryption-key-with-thirty-two-characters
      INTERNAL_API_TOKEN: ci-internal-api-token-with-thirty-two-characters
      SEED_PASSWORD: CI-Seed-Password-2026!
      MINIO_ROOT_USER: ci-minio-user
      MINIO_ROOT_PASSWORD: ci-minio-password-with-thirty-two-characters
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate development Compose configuration
        run: docker compose config --quiet
      - name: Start isolated application stack
        run: docker compose up -d --build db redis nats storage-init backend-core frontend
      - name: Wait for application health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs backend-core frontend
          exit 1
      - working-directory: ./frontend
        run: npm ci --legacy-peer-deps
      - working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - working-directory: ./frontend
        run: npm run test:e2e
      - name: Upload Playwright traces and visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs backend-core frontend
      - name: Tear down isolated stack
        if: always()
        run: docker compose down --volumes
