# n8n automation runtime — an OVERLAY on the main stack, not a standalone file.
#
#   docker compose -f docker-compose.yml -f docker-compose.n8n.yml up -d
#   (or: make n8n-up)
#
# Merging the two files puts n8n on the same project network as everything else,
# so its workflows reach the backend at http://backend-core:4000 by service name.
# Running this file alone would isolate n8n on its own network, where that host
# does not resolve.
#
# Talking to Septimus from an n8n workflow:
#   HTTP Request node → http://backend-core:4000/api/public/v1/...
#   Header: X-API-Key: <key minted in the app under API Keys>
# The API key carries its workspace, so a workflow can only ever reach the
# workspace its key belongs to.
#
# Septimus → n8n: point a webhook subscription at an n8n Webhook node URL
# (POST /api/v1/workspaces/:workspace_id/webhooks).

services:
  backend-core:
    environment:
      # Only the optional overlay supplies the in-network n8n endpoint.
      - N8N_WEBHOOK_BASE_URL=http://n8n:5678/webhook

  n8n:
    # Pin the runtime: pulling `latest` can introduce a breaking migration on
    # every rebuild. Upgrade this version deliberately after testing backups.
    image: docker.n8n.io/n8nio/n8n:2.27.4
    restart: always
    # Loopback-only, same rule as the data stores in the main compose.
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      # Libya HQ — scheduled workflows fire against the company's clock.
      - GENERIC_TIMEZONE=${N8N_TIMEZONE:-Africa/Tripoli}
      # Pass through only when explicitly configured. If it is absent, n8n
      # reuses (or creates on first boot) the key in /home/node/.n8n/config.
      # Never provide a static fallback: it can conflict with a persisted key
      # and make every stored credential unavailable.
      - N8N_ENCRYPTION_KEY
      # n8n owns its own auth (owner account on first visit). The old
      # N8N_BASIC_AUTH_* variables are deprecated and deliberately unused.
      - N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED:-false}
      # Code nodes execute only in the isolated, version-matched sidecar below.
      # The broker remains private to the Compose network.
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN is required for the n8n overlay}
      - N8N_NATIVE_PYTHON_RUNNER=true
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  n8n-task-runners:
    # Runner protocol versions must match n8n exactly. This official sidecar
    # contains both the JavaScript and native Python runners.
    image: n8nio/runners:2.27.4
    restart: always
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN is required for the n8n overlay}
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=15
      - N8N_RUNNERS_LAUNCHER_LOG_LEVEL=info
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      n8n:
        condition: service_healthy
    # Code nodes are untrusted by definition. Keep the runner unprivileged and
    # remove every Linux capability; it receives no host mounts or host ports.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5680/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  n8n_data:
