version: "3.8"

services:
  db:
    image: ankane/pgvector:v0.5.0
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - septimus_net

  redis:
    image: redis:alpine
    restart: always
    networks:
      - septimus_net

  nats:
    image: nats:alpine
    restart: always
    command: ["-js"]
    networks:
      - septimus_net

  backend-core:
    image: myregistry.com/septimus-os-backend-core:latest
    restart: always
    environment:
      - DB_DSN=${DB_DSN}
      - REDIS_URL=${REDIS_URL}
      - NATS_URL=${NATS_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
      - redis
      - nats
    networks:
      - septimus_net

  frontend:
    image: myregistry.com/septimus-os-frontend:latest
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend-core
    networks:
      - septimus_net

  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - septimus_net

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  septimus_net:
    driver: bridge
