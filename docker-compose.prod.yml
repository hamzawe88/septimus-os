# Production stack. All services that the app depends on at runtime are
# declared here — ai-sidecar, centrifugo, and yjs-server included — so the
# production topology matches what the frontend and backend actually call.
# Required secrets use ${VAR:?} and abort `docker compose up` when missing.

services:
  db:
    image: ankane/pgvector:v0.5.0
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - septimus_net

  redis:
    image: redis:alpine
    restart: always
    networks:
      - septimus_net

  nats:
    image: nats:alpine
    restart: always
    command: ["-js"]
    networks:
      - septimus_net

  backend-core:
    image: myregistry.com/septimus-os-backend-core:latest
    restart: always
    environment:
      - DB_DSN=${DB_DSN:?}
      - REDIS_URL=${REDIS_URL:-redis:6379}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - SETTINGS_ENC_KEY=${SETTINGS_ENC_KEY:?SETTINGS_ENC_KEY is required}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      - CENTRIFUGO_SECRET=${CENTRIFUGO_SECRET:?CENTRIFUGO_SECRET is required}
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY is required}
      - CENTRIFUGO_API_URL=http://centrifugo:8000/api
      - AI_SIDECAR_URL=http://ai-sidecar:8000
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:?set to your public frontend origin(s)}
      # Optional local-embeddings fallback (set to your Ollama server; on
      # Linux add an extra_hosts host-gateway entry if it runs on the host).
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
    depends_on:
      - db
      - redis
      - nats
    networks:
      - septimus_net

  ai-sidecar:
    image: myregistry.com/septimus-os-ai-sidecar:latest
    restart: always
    # Internal only: reachable solely through the JWT-protected
    # /api/v1/ai/* proxy in backend-core.
    expose:
      - "8000"
    environment:
      - DB_DSN=${DB_DSN:?}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - BACKEND_URL=http://backend-core:4000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?}
      - CENTRIFUGO_API_URL=http://centrifugo:8000/api
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY:?}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:?}
      # Langfuse tracing stays optional (not :?): the keys can only be minted
      # from the Langfuse UI after it is already running, so requiring them here
      # would deadlock a first deploy. Unset = tracing off, sidecar unaffected.
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse:3000}
      # Local voice (key-free STT/TTS). "base" Whisper is CPU-friendly; bump to
      # "small" for better Arabic if the host can afford it.
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - VOICE_MODELS_DIR=/models
    volumes:
      - voice_models:/models
    depends_on:
      - db
      - nats
      - backend-core
      - centrifugo
    networks:
      - septimus_net

  centrifugo:
    image: centrifugo/centrifugo:v5
    restart: always
    # Env vars override the checked-in dev config.json, so production
    # secrets never live in the repo.
    volumes:
      - ./centrifugo:/centrifugo
    command: centrifugo -c config.json
    environment:
      - CENTRIFUGO_TOKEN_HMAC_SECRET_KEY=${CENTRIFUGO_SECRET:?}
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY:?}
      - CENTRIFUGO_ADMIN_PASSWORD=${CENTRIFUGO_ADMIN_PASSWORD:?}
      - CENTRIFUGO_ADMIN_SECRET=${CENTRIFUGO_ADMIN_SECRET:?}
      - CENTRIFUGO_ALLOWED_ORIGINS=${CORS_ALLOW_ORIGINS:?}
      # The subscribe proxy authenticates to backend-core with the shared
      # internal token. config.json hardcodes the dev token; production must
      # override it here so the header matches the real INTERNAL_API_TOKEN,
      # otherwise the backend fails those proxy calls closed and every client
      # subscription is denied.
      - CENTRIFUGO_PROXY_STATIC_HTTP_HEADERS={"X-Internal-Token":"${INTERNAL_API_TOKEN:?}"}
    depends_on:
      - redis
    networks:
      - septimus_net

  yjs-server:
    image: myregistry.com/septimus-os-yjs-server:latest
    restart: always
    expose:
      - "1234"
    networks:
      - septimus_net

  frontend:
    image: myregistry.com/septimus-os-frontend:latest
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?}
      - NEXT_PUBLIC_YJS_URL=${NEXT_PUBLIC_YJS_URL:?e.g. wss://yourdomain/yjs}
    depends_on:
      - backend-core
      - yjs-server
    networks:
      - septimus_net

  # LLM observability/tracing. Deliberately NOT published on a host port: the
  # UI exposes prompts and completions, so reaching it in production should be a
  # conscious act — add a Caddy route behind auth, or `docker compose port` /
  # an SSH tunnel for occasional access.
  langfuse:
    image: langfuse/langfuse:2
    restart: always
    expose:
      - "3000"
    environment:
      # Langfuse owns its schema — point this at langfuse-db, never the app db.
      - DATABASE_URL=${LANGFUSE_DATABASE_URL:?e.g. postgresql://user:pass@langfuse-db:5432/langfuse}
      - NEXTAUTH_URL=${LANGFUSE_NEXTAUTH_URL:?public URL the browser reaches Langfuse on}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:?openssl rand -base64 32}
      - SALT=${LANGFUSE_SALT:?openssl rand -base64 32}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:?exactly 64 hex chars — openssl rand -hex 32}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}
    depends_on:
      langfuse-db:
        condition: service_healthy
    networks:
      - septimus_net

  langfuse-db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:?}
    # Langfuse migrates on boot; gate startup until Postgres actually accepts.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_POSTGRES_USER:?} -d ${LANGFUSE_POSTGRES_DB:?}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 30s
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    networks:
      - septimus_net

  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - septimus_net

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  langfuse_pgdata:
  voice_models:

networks:
  septimus_net:
    driver: bridge
