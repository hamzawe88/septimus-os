services:
  db:
    image: ankane/pgvector:v0.5.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: septimus_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]

  backend-core:
    build:
      context: ./backend-core
    ports:
      - "4000:4000"
    environment:
      - DB_DSN=postgres://postgres:postgres@db:5432/septimus_db?sslmode=disable
      - REDIS_URL=redis:6379
      - NATS_URL=nats://nats:4222
      - JWT_SECRET=supersecretkey
    depends_on:
      - db
      - redis
      - nats

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - backend-core

  ai-sidecar:
    build:
      context: ./ai-sidecar
    ports:
      - "8000:8000"
    environment:
      - DB_DSN=postgres://postgres:postgres@db:5432/septimus_db
      - NATS_URL=nats://nats:4222
    depends_on:
      - db
      - nats

  caddy:
    image: caddy:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./local-cert.pem:/etc/caddy/local-cert.pem
      - ./local-key.pem:/etc/caddy/local-key.pem
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  centrifugo:
    image: centrifugo/centrifugo:v5
    volumes:
      - ./centrifugo:/centrifugo
    command: centrifugo -c config.json
    ports:
      - "8002:8000"
    depends_on:
      - redis

volumes:
  pgdata:
  caddy_data:
  caddy_config:
